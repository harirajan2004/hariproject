spring.application.name=Student_New
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false
 spring.datasource.username=root
 spring.datasource.password=root
 spring.security.user.name=hari
spring.security.user.password=1234
spring.security.user.roles=USER
 spring.jpa.generate-ddl=true
 spring.jpa.hibernate.ddl-auto = update
 spring.jpa.show-sql: true
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.root=INFO
logging.level.com.example.Student=DEBUG
logging.file.name=application.log
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.datasource.hikari.pool-name=StudentPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.servlet.multipart.max-file-size=10MB 
spring.servlet.multipart.max-request-size=10MB

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration